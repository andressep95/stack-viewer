name: deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ENVIRONMENT es pura función de la rama, no una variable guardada.
      # CLUSTER_NAME/BASE_DOMAIN sí son Variables de este repo (Settings →
      # Secrets and variables → Actions → Variables), no hardcodeadas acá.
      - name: Generar index.html estático para este build
        env:
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: envsubst '${ENVIRONMENT} ${CLUSTER_NAME} ${BASE_DOMAIN}' < index.html.template > index.html

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (sin push todavía)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/stack-viewer:${{ steps.vars.outputs.sha_short }}

      - name: Escanear vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/stack-viewer:${{ steps.vars.outputs.sha_short }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

      # Solo se llega acá si Trivy pasó — nunca queda una imagen con
      # vulnerabilidades críticas/altas publicada en el registry.
      - name: Push
        run: docker push ghcr.io/${{ github.repository_owner }}/stack-viewer:${{ steps.vars.outputs.sha_short }}

  # develop → charts/stack-viewer/values-dev.yaml. Sin gate: cada push
  # a develop llega solo a stack-viewer-dev.
  bump-manifest-dev:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: andressep95/k3s-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - run: |
          yq -i '.image.tag = "${{ needs.build-and-push.outputs.sha_short }}"' charts/stack-viewer/values-dev.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: stack-viewer-dev@${{ needs.build-and-push.outputs.sha_short }}"
          git push

  # main → charts/stack-viewer/values-prod.yaml. environment: production
  # pausa el job hasta que alguien lo apruebe manualmente en Actions
  # (requiere el Environment "production" con reviewer configurado en
  # GitHub, ver Settings → Environments del repo).
  bump-manifest-prod:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          repository: andressep95/k3s-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - run: |
          yq -i '.image.tag = "${{ needs.build-and-push.outputs.sha_short }}"' charts/stack-viewer/values-prod.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: stack-viewer-prod@${{ needs.build-and-push.outputs.sha_short }}"
          git push
