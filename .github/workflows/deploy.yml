name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/stack-viewer:${{ steps.vars.outputs.sha_short }}

      - name: Escanear vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/stack-viewer:${{ steps.vars.outputs.sha_short }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  bump-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: andressep95/k3s-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - run: |
          yq -i '.image.tag = "${{ needs.build-and-push.outputs.sha_short }}"' charts/stack-viewer/values-dev.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: stack-viewer@${{ needs.build-and-push.outputs.sha_short }}"
          git push
